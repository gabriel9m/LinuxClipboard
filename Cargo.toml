[package]
name = "clipboard-history"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "linuxclipboard"
path = "src/main.rs"

[features]
default = []
desktop-gtk = ["dep:gtk4"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
gtk4 = { version = "0.11.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
